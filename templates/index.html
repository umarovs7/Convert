<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uchrashuvga chiqamizmi?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a0f16;
            --card: #3a2430;
            --gold: #e8c4b8;
            --blush: #f3d6cf;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, #4a2233 0%, transparent 42%),
                radial-gradient(circle at 85% 80%, #2c1630 0%, transparent 45%),
                var(--bg);
            font-family: "Poppins", sans-serif;
            color: var(--blush);
        }

        .page-wrap {
            min-height: 100vh;
            align-items: safe center;
        }

        .invite-card {
            width: min(560px, 92vw);
            background: linear-gradient(180deg, #4a2d3a 0%, var(--card) 100%);
            border: 1px solid rgba(232, 196, 184, 0.18);
            border-radius: 28px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 2.6rem 2.2rem 2.2rem;
        }

        .script {
            font-family: "Great Vibes", cursive;
            font-size: 2.8rem;
            color: #fff4ee;
            line-height: 1.1;
        }

        .title {
            font-family: "Playfair Display", serif;
            font-size: 2rem;
            color: #fff8f4;
        }

        .subtitle {
            color: var(--gold);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .choice-label {
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.78rem;
            color: #d7b3aa;
        }

        .btn-yes {
            background: linear-gradient(135deg, #e8a09a, #c45c6a);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.75rem 1.8rem;
            border-radius: 999px;
            box-shadow: 0 10px 24px rgba(196, 92, 106, 0.35);
        }

        .btn-yes:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-no {
            background: transparent;
            border: 1px solid rgba(232, 196, 184, 0.4);
            color: var(--blush);
            font-weight: 500;
            padding: 0.75rem 1.8rem;
            border-radius: 999px;
            position: relative;
            z-index: 2;
            transition: transform 0.18s ease, left 0.18s ease, top 0.18s ease;
        }

        .actions {
            position: relative;
            min-height: 90px;
        }

        .btn-yes:focus-visible,
        .btn-no:focus-visible {
            outline: 2px solid #e8c4b8;
            outline-offset: 3px;
        }

        @media (max-width: 576px) {
            .invite-card {
                padding: 2rem 1.25rem 1.6rem;
            }

            .script {
                font-size: 2.2rem;
            }

            .title {
                font-size: 1.55rem;
            }

            .actions {
                min-height: 120px;
            }

            .btn-yes,
            .btn-no {
                min-height: 48px;
                min-width: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrap d-flex align-items-center justify-content-center p-3">
        <div class="invite-card text-center">
            <div class="script mb-2">Convert</div>
            <h1 class="title mb-3">Uchrashuvga chiqamizmi?</h1>
            <p class="subtitle mb-4">
                Bu oddiy savol emas — yurakdagi iliq hisni chiroyli javobga aylantirish.
                Bir kecha, bir suhbat, bir tabassum. Qolganini vaqtning o‘ziga qoldiramiz.
            </p>
            <p class="choice-label mb-3" id="hintText">Javobingizni tanlang</p>

            <div class="actions d-flex justify-content-center align-items-center gap-3" id="actions">
                <a class="btn btn-yes d-inline-flex align-items-center justify-content-center" id="yesBtn" href="{% url 'form' %}">Ha</a>
                <button class="btn btn-no" id="noBtn" type="button">Yo‘q</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const noBtn = document.getElementById("noBtn");
        const hintText = document.getElementById("hintText");
        const actions = document.getElementById("actions");

        const phrases = [
            "Adashmadingizmi?",
            "O‘ylab ko‘ring...",
            "Boshqa variant tanlang",
            "Chindan ham shundaymi?",
            "Yurak boshqacha deydi",
            "Ha tomonga qarab ko‘ring",
            "Bu tugma sizga emas",
            "Yana bir bor o‘ylab qarang"
        ];

        let phraseIndex = 0;

        function nextPhrase() {
            hintText.textContent = phrases[phraseIndex % phrases.length];
            phraseIndex += 1;
        }

        function runAway() {
            const area = actions.getBoundingClientRect();
            const btn = noBtn.getBoundingClientRect();
            const maxX = Math.max(20, area.width - btn.width - 10);
            const maxY = Math.max(10, area.height - btn.height + 40);
            const x = Math.random() * maxX - 20;
            const y = Math.random() * maxY - 20;

            noBtn.style.position = "absolute";
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            nextPhrase();
        }

        noBtn.addEventListener("mouseenter", runAway);
        noBtn.addEventListener("touchstart", function (event) {
            event.preventDefault();
            runAway();
        }, { passive: false });
        noBtn.addEventListener("click", function (event) {
            event.preventDefault();
            runAway();
        });
    </script>
</body>
</html>
