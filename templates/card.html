<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Xat</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a0f16;
            --card: #3a2430;
            --gold: #e8c4b8;
            --blush: #f3d6cf;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, #4a2233 0%, transparent 42%),
                radial-gradient(circle at 85% 80%, #2c1630 0%, transparent 45%),
                var(--bg);
            font-family: "Poppins", sans-serif;
            color: var(--blush);
            margin: 0;
            padding: 0;
        }

        .page-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .invite-card {
            width: min(560px, 92vw);
            background: linear-gradient(180deg, #4a2d3a 0%, var(--card) 100%);
            border: 1px solid rgba(232, 196, 184, 0.18);
            border-radius: 28px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 2.6rem 2.2rem 2.2rem;
            text-align: center;
        }

        .script {
            font-family: "Great Vibes", cursive;
            font-size: 2.8rem;
            color: #fff4ee;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        .title {
            font-family: "Playfair Display", serif;
            font-size: 2rem;
            color: #fff8f4;
            margin-bottom: 1.5rem;
        }

        .info-section {
            margin-top: 1rem;
        }

        .info-item {
            margin-bottom: 1.5rem;
        }

        .info-label {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #d7b3aa;
            margin-bottom: 0.4rem;
        }

        .info-value {
            font-family: "Playfair Display", serif;
            font-size: 1.4rem;
            color: #fff8f4;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e8c4b8, transparent);
            margin: 1.5rem auto;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #e8c4b8;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="invite-card">
            <div class="script">Convert</div>
            <h1 class="title">Uchrashuv taklifi</h1>
            
            <div class="divider"></div>
            
            <div class="info-section">
                <div class="info-item">
                    <div class="info-label">Qabul qiluvchi</div>
                    <div class="info-value">{{ convert.name }}</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Sana</div>
                    <div class="info-value">{{ convert.date_day|date:"d F, Y" }}</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Vaqt</div>
                    <div class="info-value">{{ convert.date_time }}</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Joy</div>
                    <div class="info-value">{{ convert.distination.name }}</div>
                </div>
            </div>
            
            <div class="divider"></div>
            
            <div class="footer">
                Bu kecha siz uchun maxsus yaratilgan ❤️
            </div>
        </div>
    </div>
</body>
</html>
